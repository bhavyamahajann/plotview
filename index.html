<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Plot Layout — 200 Plots Site Plan</title>
<meta name="description" content="Interactive SVG site plan with 200 plots: hover for plot number, size and status, click for full details, zoom and pan." />
<style>
  :root{
    --bg:#faf9f6; --border:#dcd8cf; --card:#fff; --fg:#22261f; --muted:#6b7264;
    --available:#f4f6e4; --sold:#e2a397; --reserved:#f0d79a; --hover:#a5e08a;
    --outline:#5d6b58; --label:#2b3128;
    --asphalt:#3d4148; --green:#3f6b40; --park:#6da55e; --park2:#5a8a4e;
    --pool:#6fb6d8; --path:#c9bfa6; --clay:#b5674a; --courtblue:#2f6f9e;
    --courtgreen:#3f8a5a; --roof:#8b5a3c; --roadlabel:#e6e3da; --marking:#c8c8bd;
    --gate:#f2c14e; --gatelabel:#2b2b20; --accent:#2f6f3f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:inherit;border-radius:8px;padding:7px 12px}
  button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:auto}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--outline);margin-right:5px;vertical-align:-1px}
  #stage{position:relative;height:78vh;min-height:520px;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--bg);touch-action:none;user-select:none;cursor:grab}
  #stage.grabbing{cursor:grabbing}
  #pan{position:absolute;inset:0;transform-origin:0 0}
  svg{width:100%;height:100%}
  .plot rect{stroke:var(--outline);stroke-width:.8;transition:fill .12s}
  .plot:hover rect{fill:var(--hover)!important}
  .plot text{fill:var(--label);font-weight:600;pointer-events:none}
  .plot{cursor:pointer}
  .plot.dim{opacity:.25}
  .plot.sel rect{stroke:var(--accent);stroke-width:3}
  #tip{position:absolute;z-index:20;min-width:150px;transform:translate(-50%,calc(-100% - 12px));background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.14);pointer-events:none;display:none}
  #tip b{display:block;font-size:14px}
  #tip span{font-size:12px;color:var(--muted)}
  #zoomctl{position:absolute;right:12px;top:12px;z-index:10;display:flex;flex-direction:column;gap:6px}
  #zoomctl button{width:36px;height:36px;padding:0;font-size:17px;line-height:1}
  #panel{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--card);border-left:1px solid var(--border);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .25s;z-index:50;overflow:auto;padding:20px}
  #panel.open{transform:none}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  #overlay.open{opacity:1;pointer-events:auto}
  .badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--border)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .cell{border:1px solid var(--border);border-radius:10px;padding:10px}
  .cell p{margin:0}
  .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .v{margin-top:4px;font-size:14px;font-weight:600}
  .hero{width:100%;height:150px;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,#6da55e,#3f6b40);display:block}
  .actions{display:flex;gap:8px;margin-top:16px}
  .actions button{flex:1;padding:10px}
  .actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #close{position:absolute;right:14px;top:14px;width:32px;height:32px;padding:0}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22261f;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive Plot Layout</h1>
  <p class="sub">200 plots · hover a plot for quick info, click for full details. Scroll to zoom, drag to pan.</p>
  <div class="bar">
    <button data-f="All" class="active">All</button>
    <button data-f="Available">Available</button>
    <button data-f="Reserved">Reserved</button>
    <button data-f="Sold">Sold</button>
    <div class="legend">
      <span><i class="dot" style="background:var(--available)"></i>Available</span>
      <span><i class="dot" style="background:var(--reserved)"></i>Reserved</span>
      <span><i class="dot" style="background:var(--sold)"></i>Sold</span>
    </div>
  </div>

  <div id="stage">
    <div id="pan"></div>
    <div id="tip"></div>
    <div id="zoomctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zres" aria-label="Reset view">⟲</button>
    </div>
  </div>
</div>

<div id="overlay"></div>
<div id="panel" aria-hidden="true"><button id="close" aria-label="Close">✕</button><div id="panelBody"></div></div>
<div id="toast"></div>

<g fill="var(--roadlabel)" font-size="11" font-weight="700" letter-spacing="0.6" text-anchor="middle">
  ${roadLabels.map(([x,y]) => `<text x="${x}" y="${y}">7.50 MTR ROAD</text>`).join("")}
  <text x="430" y="880" transform="rotate(-90 430 880)">12.00 MTR CROSSOVER ROAD</text>
  <text x="430" y="1866">PROPOSED STREET HIGHWAY</text>
</g>
<path d="M430 100 V1580" stroke="var(--marking)" stroke-width="2" stroke-dasharray="10 14" fill="none"/>
<circle cx="430" cy="47" r="14" fill="var(--gate)"/>
<text x="430" y="47" text-anchor="middle" dominant-baseline="central" fill="var(--gatelabel)" font-size="14" font-weight="700">B</text>
<circle cx="430" cy="1712" r="14" fill="var(--gate)"/>
<text x="430" y="1712" text-anchor="middle" dominant-baseline="central" fill="var(--gatelabel)" font-size="14" font-weight="700">A</text>
<path d="M430 1780 V1740 l-7 12 h14 l-7 -12" fill="var(--gate)" stroke="var(--gate)" stroke-width="3"/>
<text x="430" y="1800" text-anchor="middle" fill="var(--roadlabel)" font-size="11" font-weight="700">ENTRY</text>`;

const plotSvg = PLOTS.map(p => {
  const fs = Math.min(13, Math.max(7, Math.min(p.w,p.h)*0.42));
  return `<g class="plot" data-id="${p.id}">
    <rect x="${p.x+1}" y="${p.y+1}" width="${Math.max(p.w-2,1)}" height="${Math.max(p.h-2,1)}" rx="2" fill="${FILL[p.status]}"/>
    <text x="${p.x+p.w/2}" y="${p.y+p.h/2}" text-anchor="middle" dominant-baseline="central" font-size="${fs}">${p.plotNumber}</text>
  </g>`;
}).join("");

document.getElementById("pan").innerHTML =
  `<svg viewBox="0 0 ${MAP_W} ${MAP_H}" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision">${base}${plotSvg}</svg>`;

/* ---------- 4. ZOOM + PAN ---------- */
const stage = document.getElementById("stage"), panEl = document.getElementById("pan");
let zoom = 1, ox = 0, oy = 0, drag = null, dragging = false;
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const render = () => { panEl.style.transform = `translate(${ox}px,${oy}px) scale(${zoom})`; };
function zoomAt(next, px, py){ const z = clamp(next,0.6,8), k = z/zoom; ox = px-(px-ox)*k; oy = py-(py-oy)*k; zoom = z; render(); }
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(zoom*Math.exp(-e.deltaY*0.0018), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
document.getElementById("zin").onclick  = () => { const r=stage.getBoundingClientRect(); zoomAt(zoom*1.4,r.width/2,r.height/2); };
document.getElementById("zout").onclick = () => { const r=stage.getBoundingClientRect(); zoomAt(zoom/1.4,r.width/2,r.height/2); };
document.getElementById("zres").onclick = () => { zoom=1; ox=0; oy=0; render(); };
stage.addEventListener("pointerdown", e => { drag = {x:e.clientX,y:e.clientY,ox,oy}; });
stage.addEventListener("pointermove", e => {
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if(!dragging && Math.hypot(dx,dy) > 4){ dragging = true; stage.classList.add("grabbing"); }
  ox = drag.ox+dx; oy = drag.oy+dy; render();
});
const endDrag = () => { drag = null; stage.classList.remove("grabbing"); setTimeout(()=>dragging=false,0); };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointerleave", () => { endDrag(); tip.style.display = "none"; });

/* ---------- 5. HOVER TOOLTIP ---------- */
const tip = document.getElementById("tip");
stage.addEventListener("mousemove", e => {
  const g = e.target.closest(".plot");
  if(!g || dragging){ tip.style.display = "none"; return; }
  const p = PLOTS.find(x => x.id == g.dataset.id), r = stage.getBoundingClientRect();
  tip.innerHTML = `<b>Plot ${p.plotNumber}</b><span>${p.size}</span><span style="color:var(--fg);font-weight:600">${p.status}</span>`;
  tip.style.left = (e.clientX-r.left)+"px"; tip.style.top = (e.clientY-r.top)+"px"; tip.style.display = "block";
});

/* ---------- 6. FILTERS ---------- */
let filter = "All";
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".plot").forEach(g => {
    const p = PLOTS.find(x => x.id == g.dataset.id);
    g.classList.toggle("dim", filter !== "All" && p.status !== filter);
  });
});

/* ---------- 7. DETAILS PANEL ---------- */
const panel = document.getElementById("panel"), overlay = document.getElementById("overlay"), body = document.getElementById("panelBody");
function openPlot(p){
  document.querySelectorAll(".plot.sel").forEach(g => g.classList.remove("sel"));
  document.querySelector(`.plot[data-id="${p.id}"]`).classList.add("sel");
  body.innerHTML = `
    <h2 style="margin:0 34px 12px 0;font-size:22px">Plot No. ${p.plotNumber}
      <span class="badge" style="border-color:${FILL[p.status]};background:${FILL[p.status]}">${p.status}</span></h2>
    ${p.image ? `<img class="hero" src="${p.image}" alt="Plot ${p.plotNumber} view">` : `<div class="hero"></div>`}
    <div class="grid">
      <div class="cell"><p class="k">Size</p><p class="v">${p.size}</p></div>
      <div class="cell"><p class="k">Area</p><p class="v">${p.areaSqYards} Sq. Yd · ${p.areaSqFt.toLocaleString("en-IN")} Sq. Ft</p></div>
      <div class="cell"><p class="k">Facing</p><p class="v">${p.facing} Facing</p></div>
      <div class="cell"><p class="k">Price</p><p class="v">${inr(p.price)}</p></div>
    </div>
    <p class="k">Description</p>
    <p style="margin:4px 0 0;font-size:14px;line-height:1.6">${p.description} in a gated layout with 7.50 mtr internal roads, landscaped park, clubhouse and sports courts. Clear title, ready for registration.</p>
    <div class="actions">
      <button class="primary" id="btnContact">Contact</button>
      <button id="btnInquiry">Inquiry</button>
    </div>`;
  document.getElementById("btnContact").onclick = () => toast(`Our sales team will call you about Plot ${p.plotNumber}`);
  document.getElementById("btnInquiry").onclick = () => toast(`Inquiry raised for Plot ${p.plotNumber}`);
  panel.classList.add("open"); overlay.classList.add("open"); panel.setAttribute("aria-hidden","false");
}
const closePanel = () => { panel.classList.remove("open"); overlay.classList.remove("open"); panel.setAttribute("aria-hidden","true"); };
document.getElementById("close").onclick = closePanel;
overlay.onclick = closePanel;
document.addEventListener("keydown", e => e.key === "Escape" && closePanel());
stage.addEventListener("click", e => {
  const g = e.target.closest(".plot");
  if(g && !dragging) openPlot(PLOTS.find(x => x.id == g.dataset.id));
});

/* ---------- 8. TOAST ---------- */
let tt;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 2600); }

render();
</script>
</body>
</html>
